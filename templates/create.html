{% extends "base.html" %}
{% block title %}Nytt innlegg{% endblock %}

{% block content %}
<section class="form-section">
  <h2>New post</h2>

  <form method="post">
    <p>
      <label for="title">Title:</label>
      <input type="text" name="title" id="title" class="form-field" required>
    </p>

    <p>
      <label for="date">Date:</label>
      <input type="date" name="date" id="date" class="form-field" required>
    </p>

    <p>
      <label for="body">Content:</label>
      <textarea name="body" id="body" rows="8" class="form-field" required></textarea>
    </p>

    <p>
      <label for="image">Image:</label>
      <select name="image" id="image" class="form-field" required>
        <option value="">Choose image</option>
        <option value="soft-duvet.jpg">soft-duvet.jpg</option>
        <option value="concrete-step.jpg">concrete-step.jpg</option>
        <option value="mood-fan.jpg">mood-fan.jpg</option>
        <option value="bridge-concrete.jpg">bridge-concrete.jpg</option>
        <option value="stair-straight.jpg">stair-straight.jpg</option>
        <option value="beige-chair.jpg">beige-chair.jpg</option>
        <option value="inspo-wall.jpg">inspo-wall.jpg</option>
        <option value="soft-wall-curtain.jpg">soft-wall-curtain.jpg</option>
        <option value="stair-wavy.jpg">stair-wavy.jpg</option>
        <option value="abstract-circle-beige.jpg">abstract-circle-beige.jpg</option>
        <option value="abstract-wavy.jpg">abstract-wavy.jpg</option>
        <option value="beige-terasse.jpg">beige-terasse.jpg</option>
        <option value="sand-stone.jpg">sand-stone.jpg</option>
        <option value="stone-white.jpg">stone-white.jpg</option>
        <option value="white-curtain.jpg">white-curtain.jpg</option>
      </select>
    </p>

    <p>
      <button type="submit">Publish</button>
    </p>
  </form>

  <p><a href="{{ url_for('index') }}">← Back</a></p>
</section>
{% endblock %}
