{% extends "base.html" %}
{% block title %}Nytt innlegg{% endblock %}

{% block content %}
<section class="form-section">
  <h2>New post</h2>

  <form method="post">
    <p>
      <label for="title">Title:</label>
      <input type="text" name="title" id="title" class="form-field" required>
    </p>

    <p>
      <label for="date">Date:</label>
      <input type="date" name="date" id="date" class="form-field" required>
    </p>

    <p>
      <label for="body">Content:</label>
      <textarea name="body" id="body" rows="15" class="form-field" required></textarea>
    </p>

    <p>
      <button type="submit">Publish</button>
    </p>
  </form>

  <p><a href="{{ url_for('index') }}">← Back</a></p>
</section>
{% endblock %}
