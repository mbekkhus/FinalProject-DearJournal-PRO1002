{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<section class="form-section">
    <h2>Login</h2>

    {% if error %}
    <p class="form-error">{{ error }}</p>
    {% endif %}

    <form method="post">
        <p>
            <label for="username">Username:</label>
            <input type="text" name="username" id="username" class="form-field" required>
        </p>

        <p>
            <label for="password">Password:</label>
            <input type="password" name="password" id="password" class="form-field" required>
        </p>

        <button type="submit">Log in</button>
    </form>

    <p class="back-link">
        <a href="{{ url_for('index') }}">← Back</a>
    </p>
</section>
{% endblock %}
