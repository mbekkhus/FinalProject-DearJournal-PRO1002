{% extends "base.html" %}
{% block title %}Forside{% endblock %}

{% block content %}
  <h2>Innlegg</h2>

  {% for post in posts %}
    <article>
      <h3>
        <a href="{{ url_for('view_post', post_id=post['id']) }}">
          {{ post['title'] }}
        </a>
      </h3>
      <p><small>{{ post['date'] }}</small></p>
      <p>{{ post['body'][:100] }}...</p>
    </article>
    <hr>
  {% endfor %}
{% endblock %}
