<!doctype html>
<html lang="no">

<head>
  <meta charset="utf-8">
  <title>{% block title %}Blogg{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap"
    rel="stylesheet">
</head>

<body>
  <header>
    <div class="header-inner">
      <h1><a href="{{ url_for('index') }}">Dear Journal</a></h1>
      <nav>
        {% if session.get("logged_in") %}
        <a href="{{ url_for('create_post') }}">NEW POST</a>
        {% else %}
        <a href="{{ url_for('login', next=request.path) }}">LOGIN</a>
        {% endif %}
      </nav>
    </div>
    <hr>
  </header>

  <section class="hero">
    <div class="hero-overlay">
      <p>Personal journal</p>
      <h2>Stories, thoughts & slow moments</h2>
    </div>
  </section>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="footer-inner">

      <div class="footer-info">
        <p>Dear Journal</p>
        <small>Built with Flask + SQLite · Images from Unsplash</small>
      </div>

      {% if session.get("logged_in") %}
      <a href="{{ url_for('logout') }}" class="logout-link">
        Log out
      </a>
      {% endif %}
    </div>
  </footer>

</body>

</html>
