<!doctype html>
<html lang="no">

<head>
  <meta charset="utf-8">
  <title>{% block title %}Blogg{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap"
    rel="stylesheet">
</head>

<body>
  <header>
    <div class="header-inner">
      <h1><a href="{{ url_for('index') }}">Dear Journal</a></h1>
      <nav>
        <a href="{{ url_for('create_post') }}">New post</a>
      </nav>
    </div>
    <hr>
  </header>

  <section class="hero">
    <div class="hero-overlay">
      <p>Personal journal</p>
      <h2>Stories, thoughts & slow moments</h2>
    </div>
  </section>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <hr>
    <small>Flask + SQLite</small>
    <small>
      Images from Unsplash
    </small>
  </footer>
</body>

</html>
