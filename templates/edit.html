{% extends "base.html" %}
{% block title %}Rediger innlegg{% endblock %}

{% block content %}
<h2>Edit post</h2>

<form method="post" class="form-section">
  <p>
    <label for="title">Title:</label>
    <input type="text" name="title" id="title" class="form-field" value="{{ post['title'] }}" required>
  </p>

  <p>
    <label for="date">Date:</label>
    <input type="date" name="date" id="date" class="form-field" value="{{ post['date'] }}" required>
  </p>

  <p>
    <label for="body">Content:</label>
    <textarea name="body" id="body" rows="8" class="form-field" required>{{ post['body'] }}</textarea>
  </p>

  <button type="submit">Save changes</button>
</form>
{% endblock %}
